services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lubricentro
      POSTGRES_PASSWORD: lubricentro_dev_pass
      POSTGRES_DB: lubricentro_meza
    ports:
      - "5432:5432"
    volumes:
      - lubricentro_pg:/var/lib/postgresql/data

volumes:
  lubricentro_pg:
